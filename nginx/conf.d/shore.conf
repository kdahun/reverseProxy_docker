# ── Upstream: 외부 restAPI 서버 ────────────────────────────
# API_HOST / API_PORT 는 entrypoint.sh 에서 envsubst 로 치환됨
upstream api_server {
    server 192.168.50.4:28080;
    keepalive 16;            # Nginx → API Server 유휴 keepalive 연결 최대 16개
    keepalive_timeout  30m;  # 유휴 연결 유지 시간 (미설정 시 기본 60s → 조기 종료)
    keepalive_requests 1000; # 연결당 최대 요청 수 (초과 시 연결 재생성)
}

# ────────────────────────────────────────────────────────────
# REST API + WebSocket  (선박 HAProxy 192.168.50.241:28080 → 해안 Nginx 192.168.50.9:29090 → restAPI 192.168.50.9:5000)
#   WebSocket 경로 : /ws
#   REST 경로      : /api/test, /api/login
# ────────────────────────────────────────────────────────────
server {
    listen 29090 ssl;
    server_name _;

    # ── TLS 설정 ───────────────────────────────────────────
    # Nginx 자신의 인증서 (HAProxy가 검증할 것)
    ssl_certificate        /etc/nginx/certs/server.crt;
    ssl_certificate_key    /etc/nginx/certs/server.key;

    # mTLS: 클라이언트 인증서 검증 — TLS Handshake 중
    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client      on;
    # CRL: 폐기된 client.crt 차단 (cert_watch.sh가 5분마다 갱신)
    ssl_crl                /etc/nginx/certs/crl.pem;
    # OCSP: client.crt 폐기 여부를 Handshake 중 실시간 검증 (Nginx 1.19.0+)
    # OCSP 응답 없으면 위 ssl_crl로 검증 (독립 동작)
    # ssl_ocsp               on;
    # ssl_ocsp_cache         shared:ocsp_cache:10m;
    resolver               192.168.50.25 valid=300s;

    # OCSP Stapling: server.crt OCSP 응답을 Handshake에 포함
    # 클라이언트(Squid)가 Handshake 중 server.crt 폐기 여부 확인 가능
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_stapling_responder  http://192.168.50.25:8080/pki/ocsp;
    ssl_trusted_certificate /etc/nginx/certs/ca.pem;

    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            HIGH:!aNULL:!MD5;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_timeout    10m;

    keepalive_timeout      30m;   # HAProxy와의 연결 유지 (http-reuse always 전제조건)
    keepalive_requests     1000;

    # ── REST API ───────────────────────────────────────────
    location = /api/test {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;                    # HTTP/1.1 keepalive (기본값 1.0은 Connection:close → TLS 재연결 유발)
        proxy_set_header   Connection "";           # Connection 헤더 제거 → upstream keepalive 유지
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ship-ID        $http_x_forwarded_for;
    }

    location /api/subscriptions {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ship-ID        $http_x_forwarded_for;
    }

    location = /api/login {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ship-ID        $http_x_forwarded_for;
    }

    location = /api/register {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ship-ID        $http_x_forwarded_for;
    }

    location = /api/certificate {
        proxy_pass         http://api_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Ship-ID        $http_x_forwarded_for;
    }
    

    # ── WebSocket ──────────────────────────────────────────
    location /ws {
        proxy_pass              http://api_server;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade          $http_upgrade;
        proxy_set_header        Connection       "upgrade";
        proxy_set_header        Host             $host;
        proxy_set_header        X-Real-IP        $remote_addr;
        proxy_set_header        X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header        X-Ship-ID        $http_x_forwarded_for;
        proxy_set_header        Authorization    $http_authorization;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    location / {
        return 403 '{"error":"forbidden"}';
        add_header Content-Type application/json;
    }
}

# ────────────────────────────────────────────────────────────
# CA 서버 Web UI (사용자 브라우저 → HTTPS → Nginx → CA 서버)
#   사용자 접속 : https://<Nginx-IP>:9443/login
#   백엔드      : http://192.168.50.25:8080  (Spring Boot)
# ────────────────────────────────────────────────────────────
upstream ca_web_server {
    server 192.168.50.25:8080;
    keepalive 8;
}

server {
    listen 9443 ssl;
    server_name _;

    # ── TLS 설정 (서버 인증서만, mTLS 없음) ───────────────────
    ssl_certificate        /etc/nginx/certs/server.crt;
    ssl_certificate_key    /etc/nginx/certs/server.key;

    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            HIGH:!aNULL:!MD5;
    ssl_session_cache      shared:SSL:5m;
    ssl_session_timeout    10m;

    # ── Spring Boot 전체 경로 프록시 ──────────────────────────
    # /login, POST /login, CSS/JS/이미지 등 모두 백엔드로 전달
    location / {
        proxy_pass         http://ca_web_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Spring Security가 HTTPS임을 인식하도록 (http → https 리다이렉트 방지)
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port  9443;

        # 백엔드가 보내는 Location 헤더(리다이렉트)의 http://를 https://로 변환
        proxy_redirect     http://192.168.50.25:8080 https://$host:9443;
    }
}

# ────────────────────────────────────────────────────────────
# Nginx Status (내부 모니터링 전용)
# ────────────────────────────────────────────────────────────
server {
    listen 29091;
    server_name _;

    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny  all;

    location /nginx_status {
        stub_status;
    }
}


